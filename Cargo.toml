[package]
name = "dict"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
itertools = "0.15.0"
reqwest = "0.13.4"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
terminal_size = "0.4.4"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
